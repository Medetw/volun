version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-bookworm
    container_name: volunteering_db_prod
    environment:
      POSTGRES_DB: volunteering_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - app-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: volunteering_redis_prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    networks:
      - app-network

  # Django Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volunteering_backend_prod
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/volunteering_platform
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
      - CORS_ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - media_files_prod:/app/media
      - static_files_prod:/app/static
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --worker-class sync --worker-tmp-dir /dev/shm --max-requests 1000 --max-requests-jitter 100 --timeout 30 --keep-alive 2 config.wsgi:application"
    restart: unless-stopped
    networks:
      - app-network

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volunteering_celery_prod
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/volunteering_platform
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
    volumes:
      - media_files_prod:/app/media
      - static_files_prod:/app/static
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info --concurrency=2
    restart: unless-stopped
    networks:
      - app-network

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volunteering_celery_beat_prod
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/volunteering_platform
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
    volumes:
      - media_files_prod:/app/media
      - static_files_prod:/app/static
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    networks:
      - app-network

  # Vue.js Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: volunteering_frontend_prod
    environment:
      - VITE_API_BASE_URL=/api
    restart: unless-stopped
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:bookworm
    container_name: volunteering_nginx_prod
    ports:
      - "80:80"
      - "443:443"  # Для HTTPS в продакшене
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Для SSL сертификатов
      - static_files_prod:/var/www/static:ro
      - media_files_prod:/var/www/media:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - app-network

# Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  media_files_prod:
    driver: local
  static_files_prod:
    driver: local
