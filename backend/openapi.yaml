openapi: 3.0.3
info:
  title: Volunteering Platform API
  version: 0.1.0
  description: Backend API for the volunteering platform
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate user and get JWT tokens.
      summary: Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Login successful
        '400':
          description: Invalid credentials
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve the authenticated user's profile.
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: Unauthorized
  /api/auth/me/update/:
    put:
      operationId: auth_me_update_update
      description: Update the authenticated user's profile information.
      summary: Update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
    patch:
      operationId: auth_me_update_partial_update
      description: Update the authenticated user's profile information.
      summary: Update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /api/auth/register/organization/:
    post:
      operationId: auth_register_organization_create
      description: Create a new organization account with profile information.
      summary: Register a new organization
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationRegister'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Organization registered successfully
        '400':
          description: Validation error
  /api/auth/register/volunteer/:
    post:
      operationId: auth_register_volunteer_create
      description: Create a new volunteer account with profile information.
      summary: Register a new volunteer
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VolunteerRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VolunteerRegister'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Volunteer registered successfully
        '400':
          description: Validation error
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: ViewSet for viewing categories (read-only).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: ViewSet for viewing categories (read-only).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      description: Get list of projects with filtering and search capabilities.
      summary: List projects
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: format
        schema:
          type: string
          enum:
          - hybrid
          - offline
          - online
        description: |-
          * `online` - Online
          * `offline` - Offline
          * `hybrid` - Hybrid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - cancelled
          - completed
          - draft
        description: |-
          * `draft` - Draft
          * `active` - Active
          * `completed` - Completed
          * `cancelled` - Cancelled
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectListList'
          description: ''
    post:
      operationId: projects_create
      description: Create a new project (organizations only).
      summary: Create project
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateUpdate'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: Retrieve detailed information about a project.
      summary: Get project details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    put:
      operationId: projects_update
      description: Update project information (owner only).
      summary: Update project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateUpdate'
          description: ''
    patch:
      operationId: projects_partial_update
      description: |-
        ViewSet for projects.

        - List: Public access, filtered by status, category, region, format
        - Retrieve: Public access
        - Create: Only for organizations
        - Update/Delete: Only for project owner
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectCreateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateUpdate'
          description: ''
    delete:
      operationId: projects_destroy
      description: Delete a project (owner only).
      summary: Delete project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/my/:
    get:
      operationId: projects_my_retrieve
      description: Get current organization's projects.
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
  /api/regions/:
    get:
      operationId: regions_list
      description: ViewSet for viewing regions (read-only).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - regions
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
          description: ''
  /api/regions/{id}/:
    get:
      operationId: regions_retrieve
      description: ViewSet for viewing regions (read-only).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this region.
        required: true
      tags:
      - regions
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Category:
      type: object
      description: Serializer for Category model.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    FormatEnum:
      enum:
      - online
      - offline
      - hybrid
      type: string
      description: |-
        * `online` - Online
        * `offline` - Offline
        * `hybrid` - Hybrid
    Login:
      type: object
      description: Serializer for user login.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    OrganizationRegister:
      type: object
      description: Serializer for organization registration.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
        phone:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 255
        organization_type:
          $ref: '#/components/schemas/OrganizationTypeEnum'
        description:
          type: string
        region:
          type: string
          maxLength: 255
        contacts:
          type: object
          additionalProperties: {}
      required:
      - email
      - name
      - organization_type
      - password
      - password_confirm
    OrganizationTypeEnum:
      enum:
      - ngo
      - initiative_group
      - government
      type: string
      description: |-
        * `ngo` - NPO/NGO
        * `initiative_group` - Initiative group
        * `government` - Government
    PaginatedProjectListList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectList'
    PatchedProjectCreateUpdate:
      type: object
      description: Serializer for creating and updating projects.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        category_id:
          type: integer
          writeOnly: true
        format:
          $ref: '#/components/schemas/FormatEnum'
        region_id:
          type: integer
          writeOnly: true
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        volunteers_needed:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/StatusEnum'
        image:
          type: string
          format: uri
          nullable: true
        requirements:
          type: string
        contact_info: {}
    PatchedUserUpdate:
      type: object
      description: Serializer for updating user profile.
      properties:
        phone:
          type: string
          maxLength: 32
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          maxLength: 32
        city:
          type: string
          maxLength: 255
        region:
          type: string
          maxLength: 255
        skills:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        name:
          type: string
          maxLength: 255
        organization_type:
          $ref: '#/components/schemas/OrganizationTypeEnum'
        description:
          type: string
        contacts:
          type: object
          additionalProperties: {}
    ProjectCreateUpdate:
      type: object
      description: Serializer for creating and updating projects.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        category_id:
          type: integer
          writeOnly: true
        format:
          $ref: '#/components/schemas/FormatEnum'
        region_id:
          type: integer
          writeOnly: true
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        volunteers_needed:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/StatusEnum'
        image:
          type: string
          format: uri
          nullable: true
        requirements:
          type: string
        contact_info: {}
      required:
      - category_id
      - description
      - title
    ProjectDetail:
      type: object
      description: Serializer for project detail view.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        format:
          $ref: '#/components/schemas/FormatEnum'
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        volunteers_needed:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/StatusEnum'
        organization:
          type: object
          additionalProperties: {}
          description: Get organization profile information.
          readOnly: true
        volunteers_count:
          type: integer
          readOnly: true
        volunteers_remaining:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
        requirements:
          type: string
        contact_info: {}
      required:
      - category
      - created_at
      - description
      - id
      - organization
      - region
      - title
      - updated_at
      - volunteers_count
      - volunteers_remaining
    ProjectList:
      type: object
      description: Serializer for project list (short version).
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        format:
          $ref: '#/components/schemas/FormatEnum'
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        volunteers_needed:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/StatusEnum'
        organization_name:
          type: string
          readOnly: true
        volunteers_count:
          type: integer
          readOnly: true
        volunteers_remaining:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
      required:
      - category
      - created_at
      - description
      - id
      - organization_name
      - region
      - title
      - volunteers_count
      - volunteers_remaining
    Region:
      type: object
      description: Serializer for Region model.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 32
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    RoleEnum:
      enum:
      - volunteer
      - organization
      - admin
      type: string
      description: |-
        * `volunteer` - Volunteer
        * `organization` - Organization
        * `admin` - Admin
    StatusEnum:
      enum:
      - draft
      - active
      - completed
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      description: Serializer for user profile.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone:
          type: string
          maxLength: 32
        date_joined:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        volunteer_profile:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        organization_profile:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
      required:
      - date_joined
      - id
      - is_active
      - organization_profile
      - username
      - volunteer_profile
    UserUpdate:
      type: object
      description: Serializer for updating user profile.
      properties:
        phone:
          type: string
          maxLength: 32
