version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-bookworm
    container_name: volunteering_db_dev
    environment:
      POSTGRES_DB: volunteering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: volunteering_redis_dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: volunteering_backend_dev
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/volunteering
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    volumes:
      - ./backend:/app
      - static_files_dev:/app/staticfiles
      - media_files_dev:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - db
      - redis

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: volunteering_celery_dev
    command: celery -A config worker -l info --concurrency=2
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/volunteering
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
    volumes:
      - ./backend:/app
      - media_files_dev:/app/media
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - db
      - redis
      - backend

  # Celery Beat
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: volunteering_celery_beat_dev
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/volunteering
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - db
      - redis
      - backend

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: volunteering_frontend_dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  static_files_dev:
    driver: local
  media_files_dev:
    driver: local

networks:
  app-network:
    driver: bridge
