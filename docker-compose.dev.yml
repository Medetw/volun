version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-bookworm
    container_name: volunteering_db_dev
    environment:
      POSTGRES_DB: volunteering_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: volunteering_redis_dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

  # Django Backend Application (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volunteering_backend_dev
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/volunteering_platform
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_DEBUG=True  # Включен режим отладки
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-not-for-production}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080
    volumes:
      - ./backend:/app  # Монтируем код для hot reload
      - media_files_dev:/app/media
      - static_files_dev:/app/static
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped
    networks:
      - app-network

  # Celery Worker (Development)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volunteering_celery_dev
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/volunteering_platform
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-not-for-production}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app  # Монтируем код для hot reload
      - media_files_dev:/app/media
      - static_files_dev:/app/static
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info --concurrency=2
    restart: unless-stopped
    networks:
      - app-network

# Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  media_files_dev:
    driver: local
  static_files_dev:
    driver: local
